<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonios — Niagara Viajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <style>
    .test-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .test-admin-card {
      background: white;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s;
    }

    .test-admin-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,.07);
    }

    .test-card-body {
      padding: 1.5rem;
      flex: 1;
    }

    .test-stars {
      color: #f59e0b;
      font-size: 1rem;
      margin-bottom: .75rem;
      letter-spacing: .05em;
    }

    .test-quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-style: italic;
      color: var(--dark);
      line-height: 1.6;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .test-author-row {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .test-av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(212,175,55,.15);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .test-author-name {
      font-size: .85rem;
      font-weight: 500;
      color: var(--dark);
    }

    .test-author-viaje {
      font-size: .7rem;
      color: var(--gray);
      margin-top: .15rem;
    }

    .test-card-footer {
      padding: .75rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      background: var(--bg-light);
    }

    .test-orden-badge {
      font-size: .65rem;
      color: var(--gray);
      margin-left: auto;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a th:href="@{/dashboard}" class="topbar-brand">
    <img th:src="@{/img/logo-niagara.png}" alt="NVP" onerror="this.style.display='none'">
    <span>Niagara Viajes</span>
  </a>
  <button class="topbar-menu-btn" onclick="toggleSidebar()">
    <i class="fas fa-bars" id="topbarIcon"></i>
  </button>
</header>

<div class="dash-layout">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

  <main class="dash-main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Gestión de <em>Testimonios</em></h1>
        <p>Administra los testimonios mostrados en el sitio</p>
      </div>
      <a th:href="@{/dashboard/testimonios/nuevo}" class="btn-sm primary">
        <i class="fas fa-plus"></i> Nuevo testimonio
      </a>
    </div>

    <div class="page-content">

      <div class="dash-alert success" th:if="${success}">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
      </div>
      <div class="dash-alert error" th:if="${error}">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- Grid de testimonios -->
      <div class="test-admin-grid" th:if="${!#lists.isEmpty(testimonios)}">
        <div class="test-admin-card" th:each="t : ${testimonios}">

          <div class="test-card-body">
            <!-- Estrellas + badge activo -->
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
              <div class="test-stars" th:text="${t.estrellasStr}">★★★★★</div>
              <span class="pac-status-badge"
                    th:classappend="${t.activo} ? ' active' : ' inactive'"
                    th:text="${t.activo} ? 'Activo' : 'Inactivo'">Activo</span>
            </div>

            <!-- Texto del testimonio -->
            <div class="test-quote" th:text="|&quot;${t.texto}&quot;|">"Testimonio..."</div>

            <!-- Autor -->
            <div class="test-author-row">
              <div class="test-av" th:text="${t.inicial}">P</div>
              <div>
                <div class="test-author-name" th:text="${t.nombre}">Nombre</div>
                <div class="test-author-viaje"
                     th:if="${t.viaje != null and !#strings.isEmpty(t.viaje)}"
                     th:text="'✦ ' + ${t.viaje}">✦ Viaje</div>
              </div>
            </div>
          </div>

          <div class="test-card-footer">
            <a th:href="@{/dashboard/testimonios/{id}/editar(id=${t.id})}"
               class="btn-sm outline">
              <i class="fas fa-edit"></i> Editar
            </a>
            <form th:action="@{/dashboard/testimonios/{id}/toggle(id=${t.id})}"
                  method="post" style="display:inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn-sm outline"
                      th:style="${t.activo} ? 'color:var(--gold)' : 'color:#16a34a'"
                      th:title="${t.activo} ? 'Desactivar' : 'Activar'">
                <i th:class="${t.activo} ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                <span th:text="${t.activo} ? 'Ocultar' : 'Mostrar'">-</span>
              </button>
            </form>
            <form th:action="@{/dashboard/testimonios/{id}/eliminar(id=${t.id})}"
                  method="post" style="display:inline"
                  onsubmit="return confirm('¿Eliminar este testimonio?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn-sm danger">
                <i class="fas fa-trash"></i> Eliminar
              </button>
            </form>
            <span class="test-orden-badge">Orden: <strong th:text="${t.orden}">0</strong></span>
          </div>

        </div>
      </div>

      <!-- Empty state -->
      <div class="dash-card" th:if="${#lists.isEmpty(testimonios)}">
        <div class="dash-card-body" style="text-align:center;padding:4rem">
          <i class="fas fa-star"
             style="font-size:3rem;color:var(--gray);opacity:.3;display:block;margin-bottom:1rem"></i>
          <p style="color:var(--gray)">No hay testimonios aún.</p>
          <a th:href="@{/dashboard/testimonios/nuevo}" class="btn-sm primary"
             style="display:inline-flex;margin-top:1rem">
            <i class="fas fa-plus"></i> Crear primer testimonio
          </a>
        </div>
      </div>

    </div>
  </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
