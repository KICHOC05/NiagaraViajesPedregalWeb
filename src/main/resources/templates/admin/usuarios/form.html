<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${accion == 'crear'} ? 'Nuevo Usuario' : 'Editar Usuario'">Usuario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <style>
    /* ============================================
       ESTILOS ADICIONALES PARA GESTIÓN DE USUARIOS
       ============================================ */

    /* Contenedor del formulario */
    .form-container {
      max-width: 600px;
    }

    /* Campos del formulario */
    .form-field {
      margin-bottom: 1.5rem;
    }

    .form-field label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .form-field label i {
      color: var(--gold);
      font-size: 0.9rem;
      width: 1.1rem;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      background: white;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    /* Wrapper para contraseña con botón toggle */
    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      padding-right: 2.5rem;
    }

    .pw-toggle-dash {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.2s ease;
    }

    .pw-toggle-dash:hover {
      color: var(--gold);
    }

    /* Toggle switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cbd5e1;
      transition: 0.3s;
      border-radius: 34px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle-switch input:checked + .toggle-slider {
      background-color: var(--gold);
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .toggle-label {
      font-size: 0.85rem;
      color: var(--dark);
    }

    /* Alertas */
    .dash-alert {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .dash-alert.error {
      background: rgba(239, 68, 68, 0.12);
      border-left: 3px solid #ef4444;
      color: #991b1b;
    }

    .dash-alert i {
      font-size: 1.2rem;
    }

    /* Form actions */
    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    /* Botones */
    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
    }

    .btn-sm.primary {
      background: var(--gold);
      color: white;
    }

    .btn-sm.primary:hover {
      background: #b8942e;
      transform: translateY(-2px);
    }

    .btn-sm.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dark);
    }

    .btn-sm.outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-container {
        width: 100%;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions .btn-sm {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a th:href="@{/dashboard}" class="topbar-brand">
    <img th:src="@{/img/logo-niagara.png}" alt="NVP" onerror="this.style.display='none'">
    <span>Niagara Viajes</span>
  </a>
  <button class="topbar-menu-btn" onclick="toggleSidebar()">
    <i class="fas fa-bars" id="topbarIcon"></i>
  </button>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="dash-layout">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

  <main class="dash-main">
    <div class="page-header">
      <div class="page-header-left">
        <h1 th:text="${accion == 'crear'} ? 'Nuevo Usuario' : 'Editar Usuario'">Usuario</h1>
        <p th:text="${accion == 'crear'} ? 'Completa los datos del nuevo usuario' : 'Modifica los datos del usuario'"></p>
      </div>
      <div class="page-breadcrumb">
        <a th:href="@{/dashboard}">Dashboard</a>
        <span>/</span>
        <a th:href="@{/dashboard/usuarios}">Usuarios</a>
        <span>/</span>
        <span th:text="${accion == 'crear'} ? 'Nuevo' : 'Editar'">-</span>
      </div>
    </div>

    <div class="page-content">
      <div class="dash-alert error" th:if="${error}">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="dash-card form-container">
        <div class="dash-card-header">
          <h3 th:text="${accion == 'crear'} ? 'Datos del usuario' : 'Editar datos'">Datos</h3>
          <span class="card-label" th:text="${accion == 'crear'} ? 'Nuevo' : 'Edición'">-</span>
        </div>
        <div class="dash-card-body">

          <!-- CREAR -->
          <form th:if="${accion == 'crear'}"
                th:action="@{/dashboard/usuarios/nuevo}" method="post"
                autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
              <label><i class="fas fa-user"></i> Nombre completo</label>
              <input type="text" name="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="form-field">
              <label><i class="fas fa-envelope"></i> Correo electrónico</label>
              <input type="email" name="email" placeholder="correo@ejemplo.com"
                     inputmode="email" required>
            </div>

            <div class="form-field">
              <label><i class="fas fa-lock"></i> Contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="pwField" name="password"
                       placeholder="Mínimo 8 caracteres" minlength="8" required>
                <button type="button" class="pw-toggle-dash" onclick="togglePwDash('pwField','pwIcon1')">
                  <i class="fas fa-eye" id="pwIcon1"></i>
                </button>
              </div>
            </div>

            <div class="form-field">
              <label><i class="fas fa-shield-alt"></i> Rol</label>
              <select name="rol" required>
                <option value="ROLE_USER">Usuario</option>
                <option value="ROLE_ADMIN">Administrador</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-sm primary">
                <i class="fas fa-save"></i> Crear usuario
              </button>
              <a th:href="@{/dashboard/usuarios}" class="btn-sm outline">
                <i class="fas fa-times"></i> Cancelar
              </a>
            </div>
          </form>

          <!-- EDITAR -->
          <form th:if="${accion == 'editar'}"
                th:action="@{/dashboard/usuarios/{id}/editar(id=${usuario.id})}"
                method="post" autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
              <label><i class="fas fa-user"></i> Nombre completo</label>
              <input type="text" name="nombre"
                     th:value="${usuario.nombre}" placeholder="Nombre completo" required>
            </div>

            <div class="form-field">
              <label><i class="fas fa-envelope"></i> Correo electrónico</label>
              <input type="email" name="email"
                     th:value="${usuario.email}" placeholder="correo@ejemplo.com"
                     inputmode="email" required>
            </div>

            <div class="form-field">
              <label><i class="fas fa-shield-alt"></i> Rol</label>
              <select name="rol" required>
                <option value="ROLE_USER"
                        th:selected="${usuario.rol == 'ROLE_USER'}">Usuario</option>
                <option value="ROLE_ADMIN"
                        th:selected="${usuario.rol == 'ROLE_ADMIN'}">Administrador</option>
              </select>
            </div>

            <div class="form-field">
              <label><i class="fas fa-toggle-on"></i> Estado</label>
              <div class="toggle-wrap">
                <label class="toggle-switch">
                  <input type="checkbox" name="activo" th:checked="${usuario.activo}">
                  <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">Usuario activo</span>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-sm primary">
                <i class="fas fa-save"></i> Guardar cambios
              </button>
              <a th:href="@{/dashboard/usuarios/{id}/password(id=${usuario.id})}"
                 class="btn-sm outline" style="color:var(--gold)">
                <i class="fas fa-key"></i> Cambiar contraseña
              </a>
              <a th:href="@{/dashboard/usuarios}" class="btn-sm outline">
                <i class="fas fa-times"></i> Cancelar
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
<script>
  // Función para toggle de contraseña
  function togglePwDash(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (field.type === 'password') {
      field.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      field.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  // Funciones para el sidebar
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const icon = document.getElementById('topbarIcon');
    const open = sidebar.classList.toggle('mobile-open');
    if (overlay) overlay.classList.toggle('active', open);
    if (icon) icon.className = open ? 'fas fa-times' : 'fas fa-bars';
  }

  function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const icon = document.getElementById('topbarIcon');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (overlay) overlay.classList.remove('active');
    if (icon) icon.className = 'fas fa-bars';
  }
</script>
</body>
</html>
