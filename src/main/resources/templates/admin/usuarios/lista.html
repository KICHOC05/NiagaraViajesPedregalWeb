<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — Niagara Viajes</title>
  <th:block th:insert="~{fragments/favicons :: favicon}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<header class="topbar">
  <a th:href="@{/dashboard}" class="topbar-brand">
    <img th:src="@{/img/logo-niagara.png}" alt="NVP" onerror="this.style.display='none'">
    <span>Niagara Viajes</span>
  </a>
  <button class="topbar-menu-btn" onclick="toggleSidebar()">
    <i class="fas fa-bars" id="topbarIcon"></i>
  </button>
</header>

<div class="dash-layout">

  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

  <main class="dash-main">

    <div class="page-header">
      <div class="page-header-left">
        <h1>Gestión de <em>Usuarios</em></h1>
        <p>Administra los usuarios del sistema</p>
      </div>
      <a th:href="@{/dashboard/usuarios/nuevo}" class="btn-sm primary">
        <i class="fas fa-user-plus"></i> Nuevo usuario
      </a>
    </div>

    <div class="page-content">

      <!-- Alertas -->
      <div class="dash-alert success" th:if="${success}">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
      </div>
      <div class="dash-alert error" th:if="${error}">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- Buscador -->
      <div class="dash-card" style="margin-bottom:1.5rem">
        <div class="dash-card-body" style="padding:1rem 1.5rem">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput"
                   placeholder="Buscar por nombre, email o rol..."
                   oninput="filterTable()">
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="dash-card">
        <div class="dash-card-header">
          <h3>Lista de usuarios</h3>
          <span class="card-label"
                th:text="${#lists.size(usuarios)} + ' registros'">0 registros</span>
        </div>
        <div class="dash-card-body" style="padding:0;overflow-x:auto">
          <table class="dash-table" id="usuariosTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Creado</th>
                <th style="text-align:center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}" style="color:var(--gray);font-size:.75rem">#1</td>
                <td>
                  <div style="display:flex;align-items:center;gap:.7rem">
                    <div class="av-sm" th:text="${u.nombre?.substring(0,1)?.toUpperCase()}">A</div>
                    <span style="font-weight:500" th:text="${u.nombre}">Nombre</span>
                  </div>
                </td>
                <td style="font-size:.82rem" th:text="${u.email}">email</td>
                <td>
                  <span class="badge admin" th:if="${u.rol == 'ROLE_ADMIN'}">Admin</span>
                  <span class="badge" style="background:rgba(107,114,128,.1);color:var(--gray)"
                        th:unless="${u.rol == 'ROLE_ADMIN'}">User</span>
                </td>
                <td>
                  <span class="badge active"   th:if="${u.activo}">Activo</span>
                  <span class="badge inactive" th:unless="${u.activo}">Inactivo</span>
                </td>
                <td style="font-size:.75rem;color:var(--gray)"
                    th:text="${#temporals.format(u.createdAt,'dd/MM/yyyy')}">-</td>
                <td>
                  <div class="action-btns">
                    <a th:href="@{/dashboard/usuarios/{id}/editar(id=${u.id})}"
                       class="btn-sm outline" title="Editar">
                      <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/dashboard/usuarios/{id}/password(id=${u.id})}"
                       class="btn-sm outline" title="Cambiar contraseña"
                       style="color:var(--blue)">
                      <i class="fas fa-key"></i>
                    </a>
                    <!-- Toggle activo -->
                    <form th:action="@{/dashboard/usuarios/{id}/toggle(id=${u.id})}"
                          method="post" style="display:inline">
                      <input type="hidden" th:name="${_csrf.parameterName}"
                             th:value="${_csrf.token}">
                      <button type="submit" class="btn-sm outline"
                              th:title="${u.activo} ? 'Desactivar' : 'Activar'"
                              th:style="${u.activo} ? 'color:var(--gold)' : 'color:var(--success)'">
                        <i th:class="${u.activo} ? 'fas fa-toggle-on' : 'fas fa-toggle-off'"></i>
                      </button>
                    </form>
                    <!-- Eliminar -->
                    <form th:action="@{/dashboard/usuarios/{id}/eliminar(id=${u.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')">
                      <input type="hidden" th:name="${_csrf.parameterName}"
                             th:value="${_csrf.token}">
                      <button type="submit" class="btn-sm danger" title="Eliminar">
                        <i class="fas fa-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="7" style="text-align:center;padding:3rem;color:var(--gray)">
                  <i class="fas fa-users" style="font-size:2rem;display:block;margin-bottom:.5rem;opacity:.3"></i>
                  No hay usuarios registrados
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
