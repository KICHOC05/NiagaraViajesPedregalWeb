<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Contraseña — Niagara Viajes</title>
  <th:block th:insert="~{fragments/favicons :: favicon}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <style>
    /* ============================================
       ESTILOS ADICIONALES PARA CAMBIO DE CONTRASEÑA
       ============================================ */

    /* Contenedor del formulario */
    .form-container {
      max-width: 480px;
    }

    /* Campos del formulario */
    .form-field {
      margin-bottom: 1.5rem;
    }

    .form-field label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .form-field label i {
      color: var(--gold);
      font-size: 0.9rem;
      width: 1.1rem;
    }

    .form-field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      background: white;
    }

    .form-field input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    /* Wrapper para contraseña con botón toggle */
    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      padding-right: 2.5rem;
    }

    .pw-toggle-dash {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.2s ease;
    }

    .pw-toggle-dash:hover {
      color: var(--gold);
    }

    /* Indicador de fuerza de contraseña */
    .pw-strength {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .pw-strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .pw-strength-bar.weak {
      background: #dc2626;
      width: 25%;
    }

    .pw-strength-bar.medium {
      background: #ea580c;
      width: 50%;
    }

    .pw-strength-bar.good {
      background: #ca8a04;
      width: 75%;
    }

    .pw-strength-bar.strong {
      background: #16a34a;
      width: 100%;
    }

    .pw-strength-text {
      font-size: 0.7rem;
      font-weight: 500;
      min-width: 70px;
    }

    .pw-strength-text.weak { color: #dc2626; }
    .pw-strength-text.medium { color: #ea580c; }
    .pw-strength-text.good { color: #ca8a04; }
    .pw-strength-text.strong { color: #16a34a; }

    /* Mensaje de coincidencia */
    .match-message {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
    }

    .match-message.success {
      background: rgba(22, 163, 74, 0.1);
      color: #16a34a;
    }

    .match-message.error {
      background: rgba(220, 38, 38, 0.1);
      color: #dc2626;
    }

    /* Alertas */
    .dash-alert {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .dash-alert.error {
      background: rgba(239, 68, 68, 0.12);
      border-left: 3px solid #ef4444;
      color: #991b1b;
    }

    .dash-alert.info {
      background: rgba(212, 175, 55, 0.12);
      border-left: 3px solid var(--gold);
      color: #8b6914;
    }

    .dash-alert i {
      font-size: 1.2rem;
    }

    /* Avatar pequeño */
    .av-sm {
      width: 40px;
      height: 40px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--gold);
    }

    /* Form actions */
    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    /* Botones */
    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
    }

    .btn-sm.primary {
      background: var(--gold);
      color: white;
    }

    .btn-sm.primary:hover {
      background: #b8942e;
      transform: translateY(-2px);
    }

    .btn-sm.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sm.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dark);
    }

    .btn-sm.outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-container {
        width: 100%;
      }

      .form-actions {
        flex-direction: column;
      }

      .form-actions .btn-sm {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a th:href="@{/dashboard}" class="topbar-brand">
    <img th:src="@{/img/logo-niagara.png}" alt="NVP" onerror="this.style.display='none'">
    <span>Niagara Viajes</span>
  </a>
  <button class="topbar-menu-btn" onclick="toggleSidebar()">
    <i class="fas fa-bars" id="topbarIcon"></i>
  </button>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="dash-layout">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

  <main class="dash-main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Cambiar <em>Contraseña</em></h1>
        <p th:text="'Usuario: ' + ${usuario.nombre}">Usuario</p>
      </div>
      <div class="page-breadcrumb">
        <a th:href="@{/dashboard}">Dashboard</a>
        <span>/</span>
        <a th:href="@{/dashboard/usuarios}">Usuarios</a>
        <span>/</span>
        <span>Contraseña</span>
      </div>
    </div>

    <div class="page-content">
      <div class="dash-alert error" th:if="${error}">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="dash-card form-container">
        <div class="dash-card-header">
          <h3>Nueva contraseña</h3>
          <div style="display:flex;align-items:center;gap:.6rem">
            <div class="av-sm"
                 th:text="${usuario.nombre?.substring(0,1)?.toUpperCase()}">A</div>
            <span style="font-size:.82rem" th:text="${usuario.nombre}">-</span>
          </div>
        </div>
        <div class="dash-card-body">

          <div class="dash-alert info" style="margin-bottom:1.2rem">
            <i class="fas fa-info-circle"></i>
            <span>Como administrador puedes cambiar la contraseña sin verificar la actual.</span>
          </div>

          <form th:action="@{/dashboard/usuarios/{id}/password(id=${usuario.id})}"
                method="post" id="pwForm" autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
              <label><i class="fas fa-lock"></i> Nueva contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="pw1" name="passwordNueva"
                       placeholder="Mínimo 8 caracteres"
                       minlength="8" required>
                <button type="button" class="pw-toggle-dash"
                        onclick="togglePwDash('pw1','ic1')">
                  <i class="fas fa-eye" id="ic1"></i>
                </button>
              </div>
              <!-- Indicador fuerza -->
              <div class="pw-strength" id="pwStr" style="display:none">
                <div class="pw-strength-bar" id="pwBar"></div>
                <span class="pw-strength-text" id="pwLbl"></span>
              </div>
            </div>

            <div class="form-field">
              <label><i class="fas fa-lock"></i> Confirmar contraseña</label>
              <div class="pw-wrap">
                <input type="password" id="pw2" name="confirmar"
                       placeholder="Repite la contraseña"
                       minlength="8" required>
                <button type="button" class="pw-toggle-dash"
                        onclick="togglePwDash('pw2','ic2')">
                  <i class="fas fa-eye" id="ic2"></i>
                </button>
              </div>
              <div id="matchMsg" class="match-message" style="display:none"></div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-sm primary" id="btnSave">
                <i class="fas fa-save"></i> Guardar contraseña
              </button>
              <a th:href="@{/dashboard/usuarios}" class="btn-sm outline">
                <i class="fas fa-arrow-left"></i> Volver
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
<script>
  // Función para toggle de contraseña
  function togglePwDash(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (field.type === 'password') {
      field.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      field.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  // Fuerza de contraseña
  const pw1 = document.getElementById('pw1');
  const pwStr = document.getElementById('pwStr');
  const pwBar = document.getElementById('pwBar');
  const pwLbl = document.getElementById('pwLbl');

  pw1.addEventListener('input', function() {
    const val = this.value;
    if (!val) {
      pwStr.style.display = 'none';
      return;
    }
    pwStr.style.display = 'flex';
    
    let score = 0;
    if (val.length >= 8) score++;
    if (val.length >= 12) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    
    const levels = [
      { width: '25%', class: 'weak', text: 'Muy débil', color: '#dc2626' },
      { width: '50%', class: 'medium', text: 'Débil', color: '#ea580c' },
      { width: '75%', class: 'good', text: 'Regular', color: '#ca8a04' },
      { width: '100%', class: 'good', text: 'Buena', color: '#ca8a04' },
      { width: '100%', class: 'strong', text: 'Muy fuerte', color: '#16a34a' }
    ];
    
    const level = levels[Math.min(score, 4)];
    pwBar.style.width = level.width;
    pwBar.style.background = level.color;
    pwLbl.textContent = level.text;
    pwLbl.className = 'pw-strength-text ' + level.class;
    
    checkMatch();
  });

  // Verificar coincidencia
  const pw2 = document.getElementById('pw2');
  const matchMsg = document.getElementById('matchMsg');
  const btnSave = document.getElementById('btnSave');

  function checkMatch() {
    const v1 = pw1.value;
    const v2 = pw2.value;
    
    if (!v2) {
      matchMsg.style.display = 'none';
      btnSave.disabled = false;
      return;
    }
    
    matchMsg.style.display = 'flex';
    
    if (v1 === v2) {
      matchMsg.className = 'match-message success';
      matchMsg.innerHTML = '<i class="fas fa-check-circle"></i> Las contraseñas coinciden';
      btnSave.disabled = false;
    } else {
      matchMsg.className = 'match-message error';
      matchMsg.innerHTML = '<i class="fas fa-times-circle"></i> Las contraseñas no coinciden';
      btnSave.disabled = true;
    }
  }

  pw2.addEventListener('input', checkMatch);

  // Validar antes de enviar
  document.getElementById('pwForm').addEventListener('submit', function(e) {
    const v1 = pw1.value;
    const v2 = pw2.value;
    if (v1 !== v2) {
      e.preventDefault();
      checkMatch();
    }
  });

  // Funciones para el sidebar
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const icon = document.getElementById('topbarIcon');
    const open = sidebar.classList.toggle('mobile-open');
    if (overlay) overlay.classList.toggle('active', open);
    if (icon) icon.className = open ? 'fas fa-times' : 'fas fa-bars';
  }

  function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const icon = document.getElementById('topbarIcon');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (overlay) overlay.classList.remove('active');
    if (icon) icon.className = 'fas fa-bars';
  }
</script>
</body>
</html>
