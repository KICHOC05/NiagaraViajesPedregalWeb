<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070d1a">
  <title>Crear Cuenta — Niagara Viajes Pedregal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-page">

  <div class="login-hero">
    <div class="login-hero-content">
      <a th:href="@{/}" class="login-brand">
        <img th:src="@{/img/logo-niagara.png}"
             alt="Niagara Viajes Pedregal"
             class="login-brand-img"
             onerror="this.style.display='none';
                      this.nextElementSibling.style.display='block'">
        <span class="login-brand-fallback">NVP</span>
        <span class="login-brand-text">
          <span class="wm">Niagara Viajes Pedregal</span>
          <span class="st">Experiencias de Lujo</span>
        </span>
      </a>
      <h1>Únete a <em>nuestra comunidad</em></h1>
    </div>
    <div style="position:relative;z-index:2">
      <blockquote class="login-quote-desktop" style="display:none">
        "Cada gran aventura comienza con una decisión."
      </blockquote>
      <div class="login-badges" style="display:none">
        <span>✦ Registro gratuito</span>
        <span>✦ Sin compromisos</span>
      </div>
    </div>
  </div>

  <div class="login-form-panel">

    <div class="login-card-header">
      <h2>Crear cuenta</h2>
      <p>Completa el formulario para comenzar</p>
    </div>

    <div class="login-alert error"   th:if="${error}"   th:text="${error}"></div>
    <div class="login-alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/registro}" method="post"
          id="registroForm" autocomplete="on" novalidate>
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">

      <div class="login-field">
        <label for="nombre">
          <i class="fas fa-user"></i> Nombre completo
        </label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Tu nombre completo"
               autocomplete="name" required>
      </div>

      <div class="login-field">
        <label for="email">
          <i class="fas fa-envelope"></i> Correo electrónico
        </label>
        <input type="email" id="email" name="email"
               placeholder="tu@email.com"
               autocomplete="email"
               inputmode="email" required>
      </div>

      <div class="login-field">
        <label for="password">
          <i class="fas fa-lock"></i> Contraseña
        </label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Mínimo 8 caracteres"
                 autocomplete="new-password"
                 minlength="8" required>
          <button type="button" class="pw-toggle"
                  onclick="togglePw('password','icon1')"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye" id="icon1"></i>
          </button>
        </div>
        <div class="pw-strength" id="pwStrength" style="display:none">
          <div class="pw-strength-bar" id="pwBar"></div>
          <span id="pwLabel"></span>
        </div>
      </div>

      <div class="login-field">
        <label for="confirmar">
          <i class="fas fa-lock"></i> Confirmar contraseña
        </label>
        <div class="pw-wrap">
          <input type="password" id="confirmar" name="confirmar"
                 placeholder="Repite tu contraseña"
                 autocomplete="new-password"
                 minlength="8" required>
          <button type="button" class="pw-toggle"
                  onclick="togglePw('confirmar','icon2')"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye" id="icon2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnRegistro">
        <span class="btn-text">
          <i class="fas fa-user-plus"></i> Crear cuenta
        </span>
        <span class="btn-loading" style="display:none">
          <i class="fas fa-spinner fa-spin"></i> Procesando...
        </span>
      </button>
    </form>

    <div class="login-divider"><span>¿Ya tienes cuenta?</span></div>

    <a th:href="@{/login}" class="btn-register">
      <i class="fas fa-sign-in-alt"></i> Iniciar sesión
    </a>

    <a th:href="@{/}" class="login-back">
      <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>

  </div>
</div>

<script>
  function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const show  = input.type === 'password';
    input.type     = show ? 'text' : 'password';
    icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
  }

  document.getElementById('password').addEventListener('input', function() {
    const val      = this.value;
    const strength = document.getElementById('pwStrength');
    const bar      = document.getElementById('pwBar');
    const lbl      = document.getElementById('pwLabel');
    if (!val) { strength.style.display = 'none'; return; }
    strength.style.display = 'flex';
    let score = 0;
    if (val.length >= 8)           score++;
    if (val.length >= 12)          score++;
    if (/[A-Z]/.test(val))         score++;
    if (/[0-9]/.test(val))         score++;
    if (/[^A-Za-z0-9]/.test(val))  score++;
    const levels = [
      { pct:'20%', color:'#dc2626', text:'Muy débil' },
      { pct:'40%', color:'#ea580c', text:'Débil' },
      { pct:'60%', color:'#ca8a04', text:'Regular' },
      { pct:'80%', color:'#16a34a', text:'Fuerte' },
      { pct:'100%',color:'#15803d', text:'Muy fuerte' },
    ];
    const lvl          = levels[Math.min(score, 4)];
    bar.style.width      = lvl.pct;
    bar.style.background = lvl.color;
    lbl.textContent      = lvl.text;
    lbl.style.color      = lvl.color;
  });

  document.getElementById('registroForm').addEventListener('submit', function(e) {
    const pw   = document.getElementById('password').value;
    const conf = document.getElementById('confirmar').value;
    if (pw !== conf) {
      e.preventDefault();
      alert('Las contraseñas no coinciden.');
      return;
    }
    document.querySelector('.btn-text').style.display    = 'none';
    document.querySelector('.btn-loading').style.display = 'inline-flex';
    document.getElementById('btnRegistro').disabled = true;
  });
</script>
</body>
</html>
