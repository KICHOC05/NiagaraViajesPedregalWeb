<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">

  <div id="progress"></div>
  <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

  <!-- MOBILE DRAWER -->
  <div class="mobile-drawer" id="drawer">
    <div class="drawer-header">
      <img th:src="@{/img/logo-niagara.png}" alt="Niagara Viajes" class="drawer-logo"
           onerror="this.style.display='none'">
      <button class="drawer-close" onclick="closeDrawer()" aria-label="Cerrar">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="drawer-items">
      <a th:href="@{/}"       onclick="closeDrawer()"><i class="fas fa-home"></i> Inicio</a>
      <a href="#servicios"    onclick="closeDrawer()"><i class="fas fa-concierge-bell"></i> Servicios</a>
      <a href="#experiencias" onclick="closeDrawer()"><i class="fas fa-compass"></i> Experiencias</a>
      <a href="#nosotros"     onclick="closeDrawer()"><i class="fas fa-users"></i> Nosotros</a>
      <a href="#agenda"       onclick="closeDrawer()"><i class="fas fa-calendar-alt"></i> Agendar Reunión</a>
      <a th:href="@{/login}"  onclick="closeDrawer()" class="drawer-login-btn">
        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
      </a>
    </div>
    <div class="drawer-footer">
      <div class="drawer-socials">
        <a href="https://www.facebook.com/NiagaraViajesPedregal" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/niagara_viajes_pedregal/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
        <a href="https://wa.me/5215623981020?text=Hola%2C%20quisiera%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i></a>
      </div>
      <p class="drawer-copy">© 2026 Niagara Viajes Pedregal</p>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav id="navbar">
    <a th:href="@{/}" class="nav-logo">
      <img th:src="@{/img/logo-niagara.png}" alt="Niagara Viajes Pedregal" class="nav-logo-img"
           onerror="this.style.display='none'">
      <span class="nav-logo-text">
        <span class="wordmark">Niagara Viajes Pedregal</span>
        <span class="sub">Experiencias de Lujo</span>
      </span>
    </a>

    <ul class="nav-links">
      <li><a href="#servicios">Servicios</a></li>
      <li><a href="#experiencias">Experiencias</a></li>
      <li><a href="#nosotros">Nosotros</a></li>
      <li>
        <a th:href="@{/login}" class="nav-login-btn">
          <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </a>
      </li>
      <li>
        <a href="#agenda" class="nav-cta">
          <i class="fas fa-calendar-alt"></i> Agendar Reunión
        </a>
      </li>
    </ul>

    <button class="hamburger" id="hamburger" aria-label="Abrir menú" onclick="toggleDrawer()">
      <span></span><span></span><span></span>
    </button>
  </nav>

</th:block>
</body>
</html>
